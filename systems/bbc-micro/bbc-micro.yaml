---
# Clock Frequency (in Hz)
clockFreq: 1000

# Video output
video:
    # Dimensions of video output
    width: 640
    height: 480
    # Scaling applied to video output
    scale: 2
    shader:
        # Vertical shader applied to output
        vert: ../shaders/scan.vert
        # Fragment shader applied to output
        frag: ../shaders/scan.frag

# Data-bus and peripherals
dataBus:
    - start: 0x0000
      end: 0x3FFF
      peripheral:
          type: ram

    #  - start: 0x8000
    #    end: 0x8000
    #    peripheral:
    #      type: terminal
    #
    #  - start: 0x8010
    #    end: 0x8010
    #    peripheral:
    #      type: keyboard

    - start: 0x8000
      end: 0xBFFF
      peripheral:
          type: "bbc-micro.paged-rom"

    - start: 0xC000
      end: 0xFFFF
      peripheral:
          type: rom
          load: os-rom/os-rom.bin
